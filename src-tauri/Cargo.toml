[package]
name = "personal_knowledge_base"
version = "0.1.0"
description = "A local-first personal knowledge base"
authors = ["Personal Knowledge Base"]
edition = "2021"

[lib]
name = "personal_knowledge_base_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
tauri = { version = "2.8.2", features = [] }
tauri-plugin-opener = "2.5.0"
tauri-plugin-dialog = "2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }
